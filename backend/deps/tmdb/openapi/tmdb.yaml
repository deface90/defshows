openapi: 3.0.3
info:
  title: TMDB (partial)
  version: "3"
  description: >
    Hand-authored partial contract for The Movie DB v3 — only the endpoints and
    fields defShows consumes. api_key and language are injected per-request.
servers:
  - url: https://api.themoviedb.org/3
paths:
  /discover/tv:
    get:
      operationId: discoverTv
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvSearchPage' }
  /genre/tv/list:
    get:
      operationId: tvGenres
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvGenreList' }
  /configuration/countries:
    get:
      operationId: countries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Country' } }
  /search/tv:
    get:
      operationId: searchTv
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvSearchPage' }
  /tv/{series_id}:
    get:
      operationId: getTvShow
      parameters:
        - name: series_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: append_to_response
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvShow' }
  /tv/{series_id}/season/{season_number}:
    get:
      operationId: getTvSeason
      parameters:
        - name: series_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: season_number
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TvSeasonDetail' }
components:
  schemas:
    Country:
      type: object
      required: [iso_3166_1, english_name]
      properties:
        iso_3166_1: { type: string }
        english_name: { type: string }
        native_name: { type: string }
    TvGenreList:
      type: object
      required: [genres]
      properties:
        genres:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
    TvSearchPage:
      type: object
      properties:
        page: { type: integer }
        total_pages: { type: integer }
        total_results: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/TvSearchResult' }
    TvSearchResult:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        original_name: { type: string }
        overview: { type: string }
        poster_path: { type: string }
        first_air_date: { type: string }
        popularity: { type: number }
        vote_average: { type: number }
        vote_count: { type: integer, format: int64 }
    TvShow:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        original_name: { type: string }
        overview: { type: string }
        poster_path: { type: string }
        backdrop_path: { type: string }
        status: { type: string }
        in_production: { type: boolean }
        first_air_date: { type: string }
        last_air_date: { type: string }
        original_language: { type: string }
        popularity: { type: number }
        vote_average: { type: number }
        vote_count: { type: integer, format: int64 }
        external_ids:
          type: object
          properties:
            imdb_id: { type: string, nullable: true }
            wikidata_id: { type: string, nullable: true }
        genres:
          type: array
          items: { $ref: '#/components/schemas/Genre' }
        seasons:
          type: array
          items: { $ref: '#/components/schemas/TvSeason' }
        next_episode_to_air:
          $ref: '#/components/schemas/TvEpisode'
        last_episode_to_air:
          $ref: '#/components/schemas/TvEpisode'
    Genre:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    TvSeason:
      type: object
      properties:
        id: { type: integer, format: int64 }
        season_number: { type: integer }
        name: { type: string }
        overview: { type: string }
        air_date: { type: string }
        episode_count: { type: integer }
        poster_path: { type: string }
    TvSeasonDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        season_number: { type: integer }
        name: { type: string }
        overview: { type: string }
        air_date: { type: string }
        poster_path: { type: string }
        episodes:
          type: array
          items: { $ref: '#/components/schemas/TvEpisode' }
    TvEpisode:
      type: object
      properties:
        id: { type: integer, format: int64 }
        season_number: { type: integer }
        episode_number: { type: integer }
        name: { type: string }
        overview: { type: string }
        air_date: { type: string }
        runtime: { type: integer }
        still_path: { type: string }
