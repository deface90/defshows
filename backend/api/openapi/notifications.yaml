openapi: 3.0.3
info:
  title: defShows Notifications API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /me/notifications:
    get:
      operationId: listNotifications
      summary: In-app notification feed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationFeed' }
        '401': { $ref: '#/components/responses/Error' }
  /me/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark the whole feed as read
      responses:
        '204': { description: No Content }
  /me/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Error' }
  /me/notifications/prefs:
    get:
      operationId: getPrefs
      summary: Get notification preferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prefs' }
    patch:
      operationId: updatePrefs
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePrefsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prefs' }
  /me/telegram:
    get:
      operationId: getTelegramStatus
      summary: Whether the user's Telegram account is linked
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramStatus' }
  /me/telegram/link:
    get:
      operationId: getTelegramLink
      summary: Issue a one-time Telegram deep link
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLink' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    NotificationItem:
      type: object
      required: [id, type, status, read, payload, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        status: { type: string }
        read: { type: boolean }
        payload: { type: string }
        created_at: { type: string }
    NotificationFeed:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/NotificationItem' }
    Prefs:
      type: object
      required: [episode_release, season_start, weekly_digest, channel, lead_time_hours]
      properties:
        episode_release: { type: boolean }
        season_start: { type: boolean }
        weekly_digest: { type: boolean }
        channel: { type: string }
        lead_time_hours: { type: integer }
    UpdatePrefsRequest:
      type: object
      properties:
        episode_release: { type: boolean }
        season_start: { type: boolean }
        weekly_digest: { type: boolean }
        lead_time_hours: { type: integer }
    TelegramLink:
      type: object
      required: [url]
      properties:
        url: { type: string }
    TelegramStatus:
      type: object
      required: [linked]
      properties:
        linked: { type: boolean }
