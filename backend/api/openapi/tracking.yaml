openapi: 3.0.3
info:
  title: defShows Tracking API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /me/shows:
    get:
      operationId: listTracked
      summary: List the user's tracked shows with progress
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackedShowList' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: addShow
      summary: Track a show (imports from TMDB on first use)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddShowRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserShow' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /me/shows/{showId}:
    get:
      operationId: getTracked
      summary: One tracked show with progress
      parameters: [{ $ref: '#/components/parameters/ShowId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackedShow' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateShow
      summary: Update status/favorite/dubbing
      parameters: [{ $ref: '#/components/parameters/ShowId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateShowRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserShow' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeShow
      summary: Stop tracking a show
      parameters: [{ $ref: '#/components/parameters/ShowId' }]
      responses:
        '204': { description: No Content }
  /me/shows/{showId}/watch:
    post:
      operationId: watchShow
      summary: Mark all catalogued episodes watched and set tracking status to completed
      description: Atomic and idempotent. Preserves existing episode ratings and watch dates. Episodes added to the catalog later are not automatically watched.
      parameters: [{ $ref: '#/components/parameters/ShowId' }]
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/shows/{showId}/episodes/{episodeId}/watch:
    post:
      operationId: watchEpisode
      summary: Mark an episode watched
      parameters:
        - { $ref: '#/components/parameters/ShowId' }
        - { $ref: '#/components/parameters/EpisodeId' }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: unwatchEpisode
      summary: Mark an episode unwatched
      parameters:
        - { $ref: '#/components/parameters/ShowId' }
        - { $ref: '#/components/parameters/EpisodeId' }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Error' }
  /me/shows/{showId}/links:
    get:
      operationId: listLinks
      summary: List reference links
      parameters: [{ $ref: '#/components/parameters/ShowId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkList' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: addLink
      summary: Add a reference link
      parameters: [{ $ref: '#/components/parameters/ShowId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddLinkRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '404': { $ref: '#/components/responses/Error' }
  /me/shows/{showId}/links/{linkId}:
    patch:
      operationId: updateLink
      summary: Update a reference link value (URL or plain text)
      parameters:
        - { $ref: '#/components/parameters/ShowId' }
        - name: linkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLinkRequest' }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteLink
      summary: Delete a reference link
      parameters:
        - { $ref: '#/components/parameters/ShowId' }
        - name: linkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }
  /me/settings:
    get:
      operationId: getSettings
      summary: Get user settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    patch:
      operationId: updateSettings
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ShowId:
      name: showId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AddShowRequest:
      type: object
      required: [tmdb_id]
      properties:
        tmdb_id: { type: integer, format: int64 }
    UserShow:
      type: object
      required: [id, show_id, status, favorite]
      properties:
        id: { type: integer, format: int64 }
        show_id: { type: integer, format: int64 }
        status: { type: string, enum: [watching, plan_to_watch, on_hold, completed, dropped] }
        favorite: { type: boolean }
        preferred_dubbing: { type: string }
    ShowRef:
      type: object
      required: [id, tmdb_id, title, airing_status]
      properties:
        id: { type: integer, format: int64 }
        tmdb_id: { type: integer, format: int64 }
        title: { type: string }
        original_title: { type: string }
        poster_url: { type: string }
        airing_status: { type: string, enum: [not_started, airing, between_seasons, ended] }
        next_episode_air_date: { type: string, nullable: true }
        vote_average: { type: number }
        vote_count: { type: integer, format: int64 }
    Progress:
      type: object
      required: [watched, total, unwatched, watched_episode_ids]
      properties:
        watched_episode_ids:
          type: array
          items: { type: integer, format: int64 }
        watched: { type: integer }
        total: { type: integer }
        unwatched: { type: integer, description: Aired but not-yet-watched episodes }
        next_unwatched_episode_id: { type: integer, format: int64, nullable: true }
    TrackedShow:
      type: object
      required: [user_show, show, progress]
      properties:
        user_show: { $ref: '#/components/schemas/UserShow' }
        show: { $ref: '#/components/schemas/ShowRef' }
        progress: { $ref: '#/components/schemas/Progress' }
    TrackedShowList:
      type: object
      required: [tracked]
      properties:
        tracked:
          type: array
          items: { $ref: '#/components/schemas/TrackedShow' }
    UpdateShowRequest:
      type: object
      properties:
        status: { type: string, enum: [watching, plan_to_watch, on_hold, completed, dropped] }
        favorite: { type: boolean }
        preferred_dubbing: { type: string }
    Link:
      type: object
      required: [id, kind, url]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [download, streaming, wiki, imdb, kinopoisk] }
        label: { type: string }
        url: { type: string }
    UpdateLinkRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
    AddLinkRequest:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [download, streaming, wiki, imdb, kinopoisk] }
        label: { type: string }
        url: { type: string }
    LinkList:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }
    Settings:
      type: object
      required: [timezone, is_public]
      properties:
        timezone: { type: string }
        is_public: { type: boolean }
    UpdateSettingsRequest:
      type: object
      required: [timezone]
      properties:
        timezone: { type: string }
        is_public: { type: boolean }
