openapi: 3.0.3
info:
  title: defShows Admin API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /admin/dubbing-studios:
    get:
      operationId: listDubbingStudios
      summary: List dubbing studios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DubbingStudioList' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createDubbingStudio
      summary: Create a dubbing studio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DubbingStudioRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DubbingStudio' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/dubbing-studios/{id}:
    put:
      operationId: updateDubbingStudio
      summary: Update a dubbing studio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DubbingStudioRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DubbingStudio' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDubbingStudio
      summary: Delete a dubbing studio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Error' }
  /admin/reports:
    get:
      operationId: listReports
      summary: List moderation reports (optionally filtered by status)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, dismissed] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportList' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/reports/{id}/resolve:
    post:
      operationId: resolveReport
      summary: Resolve or dismiss a moderation report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveReportRequest' }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    DubbingStudio:
      type: object
      required: [id, name, active]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        site_url: { type: string }
        active: { type: boolean }
    DubbingStudioList:
      type: object
      required: [studios]
      properties:
        studios:
          type: array
          items: { $ref: '#/components/schemas/DubbingStudio' }
    DubbingStudioRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        site_url: { type: string }
        active: { type: boolean }
    ReportUserSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: integer, format: int64 }
        display_name: { type: string }
    Report:
      type: object
      required: [id, reporter, target, reason, note, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        reporter: { $ref: '#/components/schemas/ReportUserSummary' }
        target: { $ref: '#/components/schemas/ReportUserSummary' }
        reason: { type: string, enum: [spam, harassment, inappropriate, other] }
        note: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    ReportList:
      type: object
      required: [reports, total]
      properties:
        total: { type: integer, format: int64 }
        reports:
          type: array
          items: { $ref: '#/components/schemas/Report' }
    ResolveReportRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [resolved, dismissed] }
