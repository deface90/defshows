openapi: 3.0.3
info:
  title: defShows Notes & Recap API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /me/notes:
    get:
      operationId: listNotes
      summary: List the user's notes for a show
      parameters:
        - name: show_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteList' }
    post:
      operationId: createNote
      summary: Create a private note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNoteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
  /me/notes/{noteId}:
    patch:
      operationId: updateNote
      summary: Update a note body
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNoteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteNote
      summary: Delete a note
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Error' }
  /shows/{showId}/recap:
    get:
      operationId: getRecap
      summary: Public generated recap
      parameters:
        - name: showId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [show, season, episode] }
        - name: season_number
          in: query
          required: false
          schema: { type: integer }
        - name: episode_number
          in: query
          required: false
          schema: { type: integer }
        - name: language
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recap' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Note:
      type: object
      required: [id, show_id, scope, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        show_id: { type: integer, format: int64 }
        scope: { type: string, enum: [show, season, episode] }
        season_number: { type: integer, nullable: true }
        episode_number: { type: integer, nullable: true }
        body: { type: string }
        created_at: { type: string }
    NoteList:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items: { $ref: '#/components/schemas/Note' }
    CreateNoteRequest:
      type: object
      required: [show_id, scope, body]
      properties:
        show_id: { type: integer, format: int64 }
        scope: { type: string, enum: [show, season, episode] }
        season_number: { type: integer, nullable: true }
        episode_number: { type: integer, nullable: true }
        body: { type: string }
    UpdateNoteRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
    Recap:
      type: object
      required: [show_id, scope, body, language]
      properties:
        show_id: { type: integer, format: int64 }
        scope: { type: string }
        season_number: { type: integer, nullable: true }
        episode_number: { type: integer, nullable: true }
        body: { type: string }
        language: { type: string }
        generated_at: { type: string }
