name: defshows

# ---------------------------------------------------------------------------
# DEV stack. Storage ports (Postgres/MinIO) are published to the host for
# tooling and inspection. All backend services share ONE locally-built image
# (deploy/Dockerfile) and differ only by `command`. For production use
# docker-compose.prod.yml (pre-built images, storage ports closed).
# ---------------------------------------------------------------------------

x-backend: &backend
  profiles: ["app"]
  restart: unless-stopped
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: defshows-backend:dev
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket, then exit.
  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set download local/$${MINIO_BUCKET} &&
      echo 'minio bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

  # ---------------------------------------------------------------------------
  # Application services (profile `app`). One image, one `command` each.
  # ---------------------------------------------------------------------------
  web:
    <<: *backend
    command: ["web"]
    ports:
      - "${WEB_PORT:-8080}:8080"

  auth:
    <<: *backend
    command: ["auth"]
    ports:
      - "${AUTH_PORT:-8081}:8080"

  notifier:
    <<: *backend
    command: ["notifier"]

  worker:
    <<: *backend
    command: ["worker"]

  # SPA served by nginx. env.js is rendered at start from API_BASE_URL (the
  # browser-reachable URL of the web API, not the in-network hostname).
  frontend:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: defshows-frontend:dev
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8080}
      APP_STORE_URL: ${FRONTEND_APP_STORE_URL:-}
      METRIKA_ID: ${FRONTEND_METRIKA_ID:-}
    depends_on:
      - web
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
  miniodata:
